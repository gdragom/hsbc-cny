<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山頂許願樹 · Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=ZCOOL+XiaoWei&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/screen.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="sky" aria-hidden="true">
        <div class="lantern l1"></div>
        <div class="lantern l2"></div>
        <div class="lantern l3"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
      </div>

      <header class="masthead">
        <p class="eyebrow">HSBC · 羊年新春</p>
        <h1>山頂許願樹</h1>
        <p class="tagline">將新年願望投向全港之巔</p>
      </header>

      <div class="scene">
        <aside class="lion left" aria-hidden="true">
          <div class="lion-body"></div>
          <div class="lion-mane"></div>
          <div class="lion-face"></div>
        </aside>

        <div class="tree-wrap">
          <div class="tree" id="tree">
            <div class="canopy"></div>
            <div class="trunk"></div>
            <div class="base"></div>
            <div class="ornaments" id="ornaments"></div>
          </div>
        </div>

        <aside class="lion right" aria-hidden="true">
          <div class="lion-body"></div>
          <div class="lion-mane"></div>
          <div class="lion-face"></div>
        </aside>
      </div>

      <div class="fly-layer" id="flyLayer" aria-hidden="true"></div>

      <aside class="join-panel">
        <div class="qr-frame">
          <img id="qrImage" alt="Scan to join" width="220" height="220" />
        </div>
        <p class="join-label">掃碼許願</p>
        <p class="room-code">房間 <span id="roomCode">·····</span></p>
        <p class="status" id="status">連接中…</p>
        <p class="counters">
          <span><strong id="phoneCount">0</strong> 位許願中</span>
          <span><strong id="wishCount">0</strong> 個願望</span>
        </p>
      </aside>

      <footer class="hint">手機上滑 · 願望飛上許願樹</footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/screen.js"></script>
  </body>
</html>
